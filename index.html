    <!-- Màu thanh trạng thái trên trình duyệt điện thoại. Giá trị này được cập
         nhật lại theo chế độ nền khi người xem đổi nền. -->
    <meta name="theme-color" content="#070a12" />

    <link rel="icon" href="/bieu_tuong.svg" type="image/svg+xml" />
    <link rel="canonical" href="%VITE_DIA_CHI_TRANG%/" />

    <!-- Đặt chế độ nền trước khi trang vẽ khung hình đầu tiên. Là tệp riêng
         chứ không phải thẻ script nội tuyến, vì Content-Security-Policy khai
         script-src 'self' mà không kèm 'unsafe-inline'. -->
    <script src="/giao_dien_som.js"></script>

    <!-- Thẻ chia sẻ liên kết. Người tuyển dụng hay dán địa chỉ vào Slack hoặc
         LinkedIn, và một ô xem trước trống rỗng ở đó trông như trang đã hỏng. -->
    <meta property="og:type" content="profile" />
    <meta property="og:title" content="Phạm Quang Huy — Data Engineer &amp; Data Analyst" />
    <meta
      property="og:description"
      content="Three years building data platforms and pipelines from source system to chart. Currently at VETC, Tasco group."
    />
    <meta property="og:url" content="%VITE_DIA_CHI_TRANG%/" />
    <meta property="og:image" content="%VITE_DIA_CHI_TRANG%/chan_dung_800.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- Hai miền phông chữ khai preconnect vì chúng nằm trên hai máy chủ khác
         nhau: tệp css đến từ fonts.googleapis.com còn tệp phông đến từ
         fonts.gstatic.com. Thiếu miền thứ hai thì lần mở kết nối tới nó xảy ra
         muộn, đúng vào lúc trình duyệt đã sẵn sàng vẽ chữ. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
